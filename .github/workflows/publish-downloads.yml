name: Publish downloads

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect installer assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site
          gh release download --repo "${{ github.repository }}" \
            --pattern '*.dmg' --pattern '*.exe' --dir _site --clobber
          cp index.html _site/index.html
          ls -lh _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
